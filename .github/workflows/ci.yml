name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/student-registration   # 👈 all run steps now start here

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: frontend/student-registration/package-lock.json # 👈 point cache to lockfile

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run tsc -- --noEmit

      - name: Run tests
        run: npm run test:ci

      - name: Build React app
        run: npm run build
