name: CI

on:
  push:
    branches: [ "main" ]   # run on pushes to main
  pull_request:
    branches: [ "main" ]   # also run on PRs

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js (adjust version if needed)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run type-checking
      - name: Run TypeScript check
        run: npm run tsc -- --noEmit

      # Run tests
      - name: Run tests
        run: npm test

      # Build React app
      - name: Build
        run: npm run build
